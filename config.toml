# The URL the site will be built for
base_url = "https://lbenitez.dev"

# The site title and description; used in feeds by default.
title = "lbenitez.dev"
description = "A personal notebook on software, learning, and the things worth remembering."
author = "Leonardo Benítez"

# The site theme to use
theme = "terminus"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# The taxonomies to be rendered for the site and their configuration
taxonomies = [
    { name = "tags", feed = true }
]

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

[markdown]
# When set to "true", emoji aliases translated to their corresponding
# Unicode emoji equivalent in the rendered Markdown files. (e.g.: :smile: => 😄)
render_emoji = true

# Syntax highlighting (Giallo, VSCode themes). Dual themes follow the site's
# dark/light toggle via the CSS light-dark() function and color-scheme.
[markdown.highlighting]
style = "inline"
light_theme = "gruvbox-light-medium"
dark_theme = "gruvbox-dark-medium"
add_color_scheme = false

[extra]
close_responsive_menu_on_resize = true
favicon_emoji = "👨‍💻"
header_title = "leonardo.md"
layout = "center"
show_default_author = false

main_menu = [
    { name = "Posts", url = "posts", trailing_slash = true },
    { name = "Notes", url = "notes", trailing_slash = true },
    { name = "Links", url = "links", trailing_slash = true },
    { name = "About", url = "about", trailing_slash = true },
]

socials = [
    { name = "github", url = "https://github.com/ldbenitez" },
]

copyright = "© $YEAR $AUTHOR :: Powered by [Zola](https://www.getzola.org)"
